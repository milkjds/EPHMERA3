<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>EPHEMERA</title>
    <script>
      // First paint: pure-black letterbox bars + the sky register before WebGL boots.

      document.documentElement.style.background = "#000";

    </div>

    <div id="picture" aria-hidden="false">
      <div id="picture-sky" aria-hidden="true"></div>
      <div id="title-card" role="img" aria-label="EPHEMERA"></div>
      <div id="credit">Aethoro&nbsp;ft.&nbsp;xia</div>
      <div id="hero-hints" aria-hidden="true"></div>
    </div>

    <div id="caption"><span id="lyric"></span></div>
    <div id="replay">Replay &#9654;</div>
    <div id="boot-status" aria-hidden="true"></div>

    <script type="module" src="/src/main.ts"></script>

</html>
